name: UDAAN AI Python Check

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  python-check:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Python Syntax Audit
        run: |
          echo "=============================="
          echo "PYTHON SYNTAX AUDIT"
          echo "=============================="
          python -m compileall -q .
          echo "PYTHON SYNTAX PASSED"

      - name: UDAAN AI Runtime Integration Test
        run: |
          echo "=============================="
          echo "UDAAN AI RUNTIME TEST"
          echo "=============================="

          python -c "from UdaanCore import process_command; result=process_command('research latest AI trends'); print(result); assert result.get('status') == 'SUCCESS'"

          echo "RUNTIME INTEGRATION PASSED"

      - name: UDAAN API Integration Test
        run: |
          echo "=============================="
          echo "UDAAN API INTEGRATION TEST"
          echo "=============================="

          python -c "from UdaanAPI import handle_command; result=handle_command('research latest AI trends'); print(result); assert result.get('status') == 'SUCCESS'"

          echo "API INTEGRATION PASSED"
