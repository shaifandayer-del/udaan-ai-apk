name: UDAAN AI Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout UDAAN AI
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify UDAAN Android Project
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/udaan/ai/MainActivity.kt
          test -f app/src/main/res/drawable/udaan_logo.xml
          echo "UDAAN Android project structure verified."

      - name: Clean Build
        env:
          UDAAN_FOUNDER_API_KEY: ${{ secrets.UDAAN_FOUNDER_API_KEY }}
        run: |
          gradle clean --no-daemon

      - name: Build UDAAN AI APK
        env:
          UDAAN_FOUNDER_API_KEY: ${{ secrets.UDAAN_FOUNDER_API_KEY }}
        run: |
          gradle assembleDebug --no-daemon

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          echo "UDAAN AI APK generated successfully."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UDAAN-AI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
